# ─── Wholesale ERP — DEV nginx vhost reference (CloudPanel) ──────────────────
#
# Same approach as the prod vhost: in CloudPanel for the DEV site
#   Sites → dev.erp.globaltradeforce.com → Vhost
# replace the default `location / { proxy_pass ... }` with the `root` + four
# location blocks below. Keep CloudPanel's listen/server_name/ssl_* lines.
#
# Differences from prod: root is the DEV site user's dist, proxy port is 8001.

server {
    listen 443 ssl http2;
    server_name dev.erp.globaltradeforce.com;

    # <-- CloudPanel injects ssl_certificate / ssl_certificate_key here. Keep them. -->

    # ===== paste from here =====================================================
    root /home/gtferp-dev/GTF/frontend/dist;
    index index.html;

    client_max_body_size 15M;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8001;
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    # ===== paste to here =======================================================
}
