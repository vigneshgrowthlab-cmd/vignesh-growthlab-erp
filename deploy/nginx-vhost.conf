# ─── Wholesale ERP — nginx vhost reference (CloudPanel) ──────────────────────
#
# CloudPanel manages the real vhost (listen 443, server_name, SSL cert paths).
# DO NOT paste this whole file over CloudPanel's vhost — you'd lose the managed
# SSL lines. Instead, in CloudPanel:
#   Sites → erp.globaltradeforce.com → Vhost (editor)
# replace the default  `location / { proxy_pass ... }`  block with the
# `root`, `index`, `client_max_body_size`, and the FOUR location blocks below,
# leaving CloudPanel's listen/server_name/ssl_* lines untouched. Save → it
# auto-tests and reloads nginx.
#
# This full server block is shown only so you can see how the pieces fit.

server {
    listen 443 ssl http2;
    server_name erp.globaltradeforce.com;

    # <-- CloudPanel injects ssl_certificate / ssl_certificate_key here. Keep them. -->

    # ===== paste from here =====================================================
    root /home/gtferp/GTF/frontend/dist;
    index index.html;

    # uploads (10 MB cap) — allow a little headroom for multipart overhead
    client_max_body_size 15M;

    # API → FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # User-uploaded files are served BY the backend (app.mount("/uploads", ...))
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # React SPA — hashed assets cached hard, everything else falls back to index.html
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    # ===== paste to here =======================================================
}
